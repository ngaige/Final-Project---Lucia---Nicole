<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--Allow the layout to scale properly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Story Magic ✨</title>

    <style>
        /*Full page background style */
          body {
            margin: 0;
            padding: 0;
            font-family: "Arial", sans-serif;
            background: linear-gradient(135deg, #cfe9ff, #e0f4ff);
            animation: bgMove 10s infinite alternate ease-in-out;
        }
/*Aninmation that moves the background from one side to the other (left to right) */
        @keyframes bgMove {
            0% { background-position: left; }
            100% { background-position: right; }
        }

        /* Centered content box */
        .container {
            background: white;
            width: 85%;
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0px 0px 20px rgba(255, 182, 240, 0.4);
        }
/*Page title style */
        h1 {
            text-align: center;
            font-size: 2.2rem;
            color: #001f3f;
        }

        h3 {
            text-align: center;
            font-weight: normal;
            color: #444;
        }

        /* Form + text inputs */
        label {
            font-weight: bold;
            color: #333;
        }

        input {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 180px;
            margin-right: 15px;
            margin-bottom: 12px;
        }

        /* Story style dropdown */
        select {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
        }

        /* Button styling */
        button {
            padding: 10px 20px;
            background-color: #2d39df;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #001f3f;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(165, 187, 237, 0.6);
        }

        /* Blinking emoji animation */
        .emoji {
            display: inline-block;
            font-size: 1.7rem;
            animation: blink 1.5s infinite alternate ease-in-out;
        }

        /*Blinking animation for the emojis */

        @keyframes blink {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(1.2); }
        }

        /* Story output box */
        .story-box {
            margin-top: 30px;
            padding: 20px;
            background: #fff3fc;
            border-radius: 15px;
            border-left: 6px solid #001f3f;
            font-size: 1.1rem;
            line-height: 1.5rem;
        }

    </style>
</head>
<body>
        <!-- Animated floating emojis -->
    <div class="emoji e1">🌸</div>
    <div class="emoji e2">🦋</div>
    <div class="emoji e3">✨</div>
    <div class="emoji e4">🌈</div>

    <!-- Main welcome card-->
    <div class="container">
        <h1>Welcome to Story Magic ✨</h1>
        <p>Create hilarious, magical, or adventurous stories with the help of AI!</p>
        <p>Get ready to dive into creativity. 🎨✨</p>

        <!--Button that takes the users to form page -->
        <form action="/start">
            <button class="start-btn">Start Creating Your Story 🌟</button>
        </form>
    </div>
    
</body>
</html>
