<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Final Project · Flask</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<!-- Floating animated emojis -->
<div class="float-emoji" style="top:30px; left:40px;">✨</div>
<div class="float-emoji" style="top:90px; right:60px; animation-delay:0.6s;">🌸</div>
<div class="float-emoji" style="top:150px; left:80%; animation-delay:1.2s;">💫</div>

<div class="container">
    <div class="card">

        <header>
            <h1 class="title">Create Your Own Story ✨</h1>
            <p class="subtitle">Fill in the blanks or let us surprise you with a randomly generated story.</p>
            <div class="tag">Interactive · Randomized · Fun 🌈</div>
        </header>

        {% if error_message %}
        <div class="alert">{{ error_message }}</div>
        {% endif %}

        <form method="POST">
            <h3 class="section">Story Inputs 🦋</h3>

            <label>Your name *</label>
            <input type="text" name="name" required value="{{ request.form.get('name','') }}">

            <label>Favorite noun *</label>
            <input type="text" name="noun" required value="{{ request.form.get('noun','') }}">

            <label>Place *</label>
            <input type="text" name="place" required value="{{ request.form.get('place','') }}">

            <label>Adjective *</label>
            <input type="text" name="adjective" required value="{{ request.form.get('adjective','') }}">

            <label>Animal *</label>
            <input type="text" name="animal" required value="{{ request.form.get('animal','') }}">

            <label>Verb (past tense) *</label>
            <input type="text" name="verb" required value="{{ request.form.get('verb','') }}">

            <label>Golden word (optional)</label>
            <input type="text" name="golden_word" value="{{ request.form.get('golden_word','') }}">
