<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Story ✨</title>

<style>
  /*The background style : soft blue gradient with animation */ 
          body {
            
            padding: 0;
            font-family: "Arial", sans-serif;
            background: linear-gradient(135deg, #cfe9ff, #e0f4ff);
            animation: bgMove 10s infinite alternate ease-in-out;
        }

        @keyframes bgMove {
            0% { background-position: left; }
            100% { background-position: right; }
        }

        /* Centered content box */
        .container {
            background: white;
            width: 85%;
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0px 0px 20px rgba(255, 182, 240, 0.4);
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            color: #001f3f;
        }

        h3 {
            text-align: center;
            font-weight: normal;
            color: #444;
        }

        /* Form inputs */
        label {
            font-weight: bold;
            color: #333;
        }

        input {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 180px;
            margin-right: 15px;
            margin-bottom: 12px;
        }

        /* Story style dropdown */
        select {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
        }

        /* Button styling */
        button {
            padding: 10px 20px;
            background-color: #001f3f;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #001f3f;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(165, 187, 237, 0.6);
        }

        /* Blinking emoji animation */
        .emoji {
            display: inline-block;
            font-size: 1.7rem;
            animation: blink 1.5s infinite alternate ease-in-out;
        }

        @keyframes blink {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(1.2); }
        }

        /* Story output box */
        .story-box {
            margin-top: 30px;
            padding: 20px;
            background: #fff3fc;
            border-radius: 15px;
            border-left: 6px solid #001f3f;
            font-size: 1.1rem;
            line-height: 1.5rem;
        }

</style>
</head>
<body>
  <div class="container">

    <h1>Create Your Own Story ✨</h1>
    <p>Fill in the blanks and choose a story style.</p>

  <!-- NOTE: action now points to /story -->
  <form action="/story" method="POST">

    <p>Your name *  
    <input type="text" name="name" required></p>

    <p>Favorite noun *  
    <input type="text" name="noun" required></p>

    <p>Place *  
    <input type="text" name="place" required></p>

    <p>Adjective *  
    <input type="text" name="adjective" required></p>

    <p>Verb (present) *  
    <input type="text" name="verb" required></p>

    <p>Animal *  
    <input type="text" name="animal" required></p>

    <p>Verb (past tense) *  
    <input type="text" name="verb_past" required></p>

    <p>Golden word (optional)  
    <input type="text" name="golden_word"></p>

    <p>
      Story style *
      <select name="story_option" required>
        <option value="" disabled selected>Select a style</option>
        <option value="adventure">Adventure</option>
        <option value="mystery">Mystery</option>
        <option value="fairytale">Fairytale</option>
        <option value="silly">Silly</option>
      </select>
    </p>

    <button type="submit">Generate Story ✨</button>

  </form>

</body>
</html>
